name: Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - ".github/workflows/check.yml"
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

jobs:
  init:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: setup venv
        run: uv venv

      - name: Install requirements
        run: uv pip install .

      - name: Install dev requirements
        run: task dev-install

      - name: lint
        run: |
          task lint
          task spell-check
